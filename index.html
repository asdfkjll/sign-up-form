<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
	<div class="left">
	    <p class="quote">
		"The cosmos is within us. We are made of star-stuff."
		<span class="quote__author">Carl Sagan</span>
	    </p>
	    <p class="img-credits">
		Photo by NASA on Unsplash 
	    </p>
	</div>
	<div class="right">
	    <form action="index.html" method="post" class="sign-up-form">
		<h1 class="sign-up-form__title">Create an Account</h1>

		<section class="sign-up-form__fullname">
		    <div class="sign-up-form__group">
			<label for="first-name">First name <span class="required">*</span></label>
			<input type="text" id="first-name" name="first-name" placeholder="John" required>
		    </div>

		    <div class="sign-up-form__group">
			<label for="last-name">Last name <span class="required">*</span></label>
			<input type="text" id="last-name" name="last-name" placeholder="Doe" required>
		    </div>
		</section>


		<div class="sign-up-form__group">
		    <label for="email">Email <span class="required">*</span></label>
		    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
		</div>

		<div class="sign-up-form__group">
		    <label for="phone">Phone number <span class="required">*</span></label>
		    <input type="tel" id="phone" name="phone" placeholder="0000-000000" equired>
		</div>

		<div class="sign-up-form__group">
		    <label for="password">Password <span class="required">*</span></label>
		    <input type="password" id="password" name="password" placeholder="password" required>
		</div>

		<div class="sign-up-form__group">
		    <label for="confirm-password">Confirm password <span class="required">*</span></label>
		    <input type="password" id="confirm-password" name="confirm-password" placeholder="password" required>
		</div>

		<button type="submit" class="sign-up-form__button">Create Account</button>
		<p class="log-in">
		    Already have an account? <a href="index.html">Log in</a>
		</p>
	    </form>		
	</div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
